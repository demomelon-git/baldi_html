name: Build APK from zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unpack game
        run: |
          rm -rf www && mkdir www
          if [ -d game ]; then
            echo "Беру папку game/"
            cp -r game/. www/
          else
            ZIP=$(ls *.zip 2>/dev/null | head -n 1)
            [ -n "$ZIP" ] || { echo "В корне репозитория нет ни .zip, ни папки game/"; exit 1; }
            echo "Распаковываю $ZIP"
            unzip -q "$ZIP" -d www
          fi
          # если архив содержит одну вложенную папку, поднять её содержимое наверх
          F=$(find www -name TMR.html | head -n 1)
          [ -n "$F" ] || { echo "TMR.html не найден в архиве"; exit 1; }
          D=$(dirname "$F")
          if [ "$D" != "www" ]; then cp -r "$D"/. www/; fi
          cp www/TMR.html www/index.html
          ls www

      - name: Create Android project (Capacitor)
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Baldi's Basics" com.baldi.basics --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Lock landscape orientation
        run: |
          sed -i 's/<activity/<activity android:screenOrientation="landscape"/' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: baldi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
