<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#111;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
#wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
canvas#c{width:100%;max-height:100%;aspect-ratio:8/5;image-rendering:pixelated;background:#000}
#hud{white-space:pre;position:absolute;left:8px;top:8px;font:bold 15px monospace;text-shadow:1px 1px 0 #000;pointer-events:none}
#msg{position:absolute;top:34%;width:100%;text-align:center;font:bold 20px monospace;text-shadow:2px 2px 0 #000;pointer-events:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:10px;text-align:center;padding:16px}
#menu{background:#000 var(--t) center top/contain no-repeat}
#quiz{display:none;background:#000c;justify-content:center;font-family:'Comic Sans MS',cursive,sans-serif}
button.sl{width:52px;height:52px;padding:0;font-size:26px;background:#0009;border:2px solid #fff8}
button{font:bold 18px system-ui;padding:12px 22px;border:0;border-radius:10px;background:#3b9b3b;color:#fff}
.pad{position:absolute;bottom:10px;display:flex;gap:6px;touch-action:none}
.pad button{width:56px;height:56px;padding:0;background:#fff4;font-size:22px;user-select:none}
#face{position:absolute;right:8px;top:8px;width:52px;height:52px;border:2px solid #fff;border-radius:8px;background:#222}
#meme{max-height:130px}#q{font-size:30px;font-weight:bold}.o{display:flex;gap:10px}

const sp=[];nb.forEach(n=>sp.push({x:n.x,y:n.y,k:'book',h:.3,l:.25}));items.forEach(n=>sp.push({x:n.x,y:n.y,k:n.k,h:.3,l:.2}));placed.forEach(n=>sp.push({x:n.x,y:n.y,k:'nokia',h:.3,l:.2}));lockers.forEach(n=>{if(Math.abs(n.x-px_)<14&&Math.abs(n.y-py)<14)sp.push({x:n.x,y:n.y,k:n.k,h:.85,l:0})});tables.forEach(n=>{if(Math.abs(n.x-px_)<14&&Math.abs(n.y-py)<14)sp.push({x:n.x,y:n.y,k:n.k||'table',h:n.h||.5,l:0})});npcs.forEach(e=>sp.push({x:e.x,y:e.y,k:e.k,h:e.h,l:0}));sp.push({x:bx,y:by,k:'baldi',h:Math.min(1.25,.75+.07*got),l:0});if(got==7)sp.push({x:ex.x,y:ex.y,k:0,h:.9,l:0});
sp.sort((a,b)=>Math.hypot(b.x-px_,b.y-py)-Math.hypot(a.x-px_,a.y-py));
for(const s of sp){const rx=s.x-px_,ry=s.y-py,inv=1/(pxn*dy-dx*pyn),tx=inv*(dy*rx-dx*ry),ty=inv*(-pyn*rx+pxn*ry);if(ty<.15)continue;
const scx=W/2*(1+tx/ty),sz=Math.abs(H/ty),h=sz*s.h,bot=H/2+sz/2-sz*s.l,y=bot-h;
if(s.k){const im=img[s.k],w=h*im.width/im.height;drawS(im,scx,w,h,ty,y)}else{ctx.fillStyle='#ffd400';const x0=scx-sz*.4;for(let x=Math.max(0,x0|0);x<Math.min(W,x0+sz*.8);x++)if(zb[x]>=ty)ctx.fillRect(x,y,1,h)}}
ctx.fillStyle='#0008';ctx.fillRect(W-MW-3,56,MW+2,MH+2);for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(map[y][x]){ctx.fillStyle=map[y][x]==2?'#38f':'#ccc';ctx.fillRect(W-MW-2+x,57+y,1,1)}
ctx.fillStyle='#0f0';ctx.fillRect(W-MW-2+px_-1,57+py-1,3,3);ctx.fillStyle='#f00';ctx.fillRect(W-MW-2+bx-1,57+by-1,3,3);npcs.forEach(e=>{ctx.fillStyle=e.k=='m3'?'#4af':'#fa0';ctx.fillRect(W-MW-2+e.x-1,57+e.y-1,3,3)})}
function drawS(im,cx,w,h,d,y){const x0=cx-w/2;for(let x=Math.max(0,x0|0);x<Math.min(W,x0+w);x++){if(zb[x]<d)continue;ctx.drawImage(im,(x-x0)/w*im.width|0,0,1,im.height,x,y,1,h)}}
